      function generateNepalQrPayload(bank, amountNPR, orderRef, method) {

        return `fonepay://pay?merchant=${encodeURIComponent(bank.fonepayMerchantCode || 'NINGSTORE01')}&acc=${encodeURIComponent(bank.accountNumber)}&name=${encodeURIComponent(bank.accountHolder)}&bank=${encodeURIComponent(bank.bankName)}&am=${amountNPR.toFixed(2)}&cu=NPR&ref=${encodeURIComponent(orderRef)}`;
      }

      async function extractProductDetailsFromUrl(rawUrl) {
        let cleanUrl = rawUrl.trim();
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
          cleanUrl = 'https://' + cleanUrl;
        }
        let parsedUrl;
        try {
          parsedUrl = new URL(cleanUrl);
        } catch {
          throw new Error('Please enter a valid URL.');
        }

        const hostname = parsedUrl.hostname.toLowerCase();
        let platformName = 'E-Commerce Store';
        if (hostname.includes('daraz')) platformName = 'Daraz Nepal';
        else if (hostname.includes('amazon')) platformName = 'Amazon';
        else if (hostname.includes('hamrobazar')) platformName = 'Hamrobazar';
        else if (hostname.includes('aliexpress')) platformName = 'AliExpress';
        else if (hostname.includes('ebay')) platformName = 'eBay';

        let extractedTitle = '';
        let extractedDesc = '';
        let extractedImages = [];
        let parsedPrice = null;

        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 3500);
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(cleanUrl)}`;
          const response = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeout);
          if (response.ok) {
            const data = await response.json();
            if (data && data.contents) {
              const parser = new DOMParser();
              const doc = parser.parseFromString(data.contents, 'text/html');
              extractedTitle = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') ||
                               doc.querySelector('title')?.textContent || '';
              extractedDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content') ||
                              doc.querySelector('meta[name="description"]')?.getAttribute('content') || '';
              const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
              if (ogImage && ogImage.startsWith('http')) extractedImages.push(ogImage);
            }
          }
        } catch {}

        if (!extractedTitle) {
          const pathParts = parsedUrl.pathname.split('/').filter(Boolean);
          let slug = pathParts[pathParts.length - 1] || '';
          slug = slug.replace(/\.(html|htm)$/i, '').replace(/-i\d+.*$/i, '').replace(/[-_]+/g, ' ').trim();
          extractedTitle = slug.split(' ')
            .filter(w => w.length > 0 && !/^\d+$/.test(w))
            .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
            .join(' ');
        }
        extractedTitle = extractedTitle.replace(/\s*\|\s*.*$/, '').replace(/Buy\s+/i, '').trim() || 'Marvel Official Merch Edition';

        const fullText = (extractedTitle + ' ' + extractedDesc + ' ' + cleanUrl).toLowerCase();
        let detectedHero = 'Iron Man';
        if (fullText.includes('spider-man') || fullText.includes('spiderman')) detectedHero = 'Spider-Man';
        else if (fullText.includes('thor') || fullText.includes('mjolnir')) detectedHero = 'Thor';
        else if (fullText.includes('captain america')) detectedHero = 'Captain America';
        else if (fullText.includes('deadpool')) detectedHero = 'Deadpool';
        else if (fullText.includes('thanos')) detectedHero = 'Thanos';
        else if (fullText.includes('black panther')) detectedHero = 'Black Panther';

        let detectedCategory = 'Apparel';
        if (fullText.includes('figure') || fullText.includes('toy') || fullText.includes('statue') || fullText.includes('diecast')) {
          detectedCategory = 'Action Figures';
        } else if (fullText.includes('replica') || fullText.includes('hammer') || fullText.includes('prop') || fullText.includes('shield')) {
          detectedCategory = 'Collectibles & Props';
        }

        let sellingPriceNPR = detectedCategory === 'Apparel' ? 1850 : detectedCategory === 'Action Figures' ? 4850 : 2950;
        let originalPriceNPR = Math.round(sellingPriceNPR * 1.25);

        const fallback = CURATED_MARVEL_ASSETS[detectedHero]?.[detectedCategory] || ['https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800&auto=format&fit=crop&q=80'];
        const allImages = Array.from(new Set([...extractedImages, ...fallback]));

        return {
          title: extractedTitle,
          hero: detectedHero,
          category: detectedCategory,
          priceNPR: sellingPriceNPR,
          originalPriceNPR: originalPriceNPR,
          image: allImages[0] || fallback[0],
          images: allImages,
          description: extractedDesc || `Official ${detectedHero} collectible merchandise imported for Ningstore Nepal fans.`,
          material: detectedCategory === 'Apparel' ? '100% Combed Cotton' : 'Diecast Alloy & PVC',
          scaleOrFit: detectedCategory === 'Apparel' ? 'Regular Fit' : '7-inch Scale',
          sizes: detectedCategory === 'Apparel' ? 'S, M, L, XL' : '',
          stock: 12,
          sourcePlatform: platformName
        };
      }

      function NingstoreApp() {
        // Products
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('ningstore_products');
            if (saved) return JSON.parse(saved);
          } catch {}
          return INITIAL_PRODUCTS;
        });

        useEffect(() => {
          localStorage.setItem('ningstore_products', JSON.stringify(products));
        }, [products]);

        // Admin Auth & Passwords
        const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('ningstore_admin_auth') === 'true');
        const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem('ningstore_admin_password') || 'ningstore');
        const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
        const [adminPasswordInput, setAdminPasswordInput] = useState('');
        const [adminLoginError, setAdminLoginError] = useState('');

        // Reset Password Modal
        const [showResetPasswordModal, setShowResetPasswordModal] = useState(false);
        const [passwordForm, setPasswordForm] = useState({ current: '', next: '', confirm: '' });
        const [passwordError, setPasswordError] = useState('');
        const [passwordSuccess, setPasswordSuccess] = useState('');

        // Bank Details & Payment Settings
        const [bankDetails, setBankDetails] = useState(() => {
          try {
            const saved = localStorage.getItem('ningstore_bank_details');
            if (saved) return JSON.parse(saved);
          } catch {}
          return DEFAULT_BANK_DETAILS;
        });

        useEffect(() => {
          localStorage.setItem('ningstore_bank_details', JSON.stringify(bankDetails));
        }, [bankDetails]);

        const [showPaymentSettingsModal, setShowPaymentSettingsModal] = useState(false);
        const [paymentForm, setPaymentForm] = useState(bankDetails);
        const [adminTestAmount, setAdminTestAmount] = useState(2500);
        const [adminPreviewQr, setAdminPreviewQr] = useState('');
        const [paymentSettingsSuccess, setPaymentSettingsSuccess] = useState('');

        // Product Management (Add / Edit)
        const [showProductModal, setShowProductModal] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [importUrl, setImportUrl] = useState('');
        const [isExtracting, setIsExtracting] = useState(false);
        const [extractSuccessMsg, setExtractSuccessMsg] = useState('');
        const [extractErrorMsg, setExtractErrorMsg] = useState('');
        const [extractedGalleryImages, setExtractedGalleryImages] = useState([]);
        const [productForm, setProductForm] = useState({
          title: '',
          hero: 'Iron Man',
          category: 'Apparel',
          priceNPR: 1800,
          originalPriceNPR: 2400,
          image: '',
          description: '',
          material: '100% Combed Cotton',
          scaleOrFit: 'Regular Fit',
          stock: 12,
          sizes: 'S, M, L, XL',
          featured: false
        });

        const handleExtractFromUrl = async (customUrl) => {
          const targetUrl = (customUrl || importUrl).trim();
          if (!targetUrl) {
            setExtractErrorMsg('Please paste a product URL to extract details.');
            return;
          }
          setIsExtracting(true);
          setExtractErrorMsg('');
          setExtractSuccessMsg('');
          try {
            const data = await extractProductDetailsFromUrl(targetUrl);
            setProductForm({
              title: data.title,
              hero: data.hero,
              category: data.category,
              priceNPR: data.priceNPR,
              originalPriceNPR: data.originalPriceNPR,
              image: data.image,
              description: data.description,
              material: data.material,
              scaleOrFit: data.scaleOrFit,
              stock: data.stock,
              sizes: data.sizes,
              featured: false
            });
            setExtractedGalleryImages(data.images);
            setExtractSuccessMsg(`Extracted from ${data.sourcePlatform}! Review and adjust details below before publishing.`);
          } catch (err) {
            setExtractErrorMsg('Could not extract details from link. You can enter them manually.');
          } finally {
            setIsExtracting(false);
          }
        };

        // Storefront Filter & Search
        const [activeCategory, setActiveCategory] = useState('All Merchandise');
        const [activeHero, setActiveHero] = useState('All Heroes');
        const [searchQuery, setSearchQuery] = useState('');
        const [sortBy, setSortBy] = useState('featured');
        const [isSearchPopoutOpen, setIsSearchPopoutOpen] = useState(false);
        const searchRef = useRef(null);

        useEffect(() => {
          const handleClickOutside = (e) => {
            if (searchRef.current && !searchRef.current.contains(e.target)) {
              setIsSearchPopoutOpen(false);
            }
          };
          const handleKey = (e) => {
            if (e.key === 'Escape') setIsSearchPopoutOpen(false);
          };
          document.addEventListener('mousedown', handleClickOutside);
          document.addEventListener('touchstart', handleClickOutside);
          window.addEventListener('keydown', handleKey);
          return () => {
            document.removeEventListener('mousedown', handleClickOutside);
            document.removeEventListener('touchstart', handleClickOutside);
            window.removeEventListener('keydown', handleKey);
          };
        }, []);

        // Cart & Checkout
        const [cart, setCart] = useState(() => {
          try {
            const saved = localStorage.getItem('ningstore_cart');
            if (saved) return JSON.parse(saved);
          } catch {}
          return [];
        });

        useEffect(() => {
          localStorage.setItem('ningstore_cart', JSON.stringify(cart));
        }, [cart]);

        const [isCartOpen, setIsCartOpen] = useState(false);
        const [selectedDeliveryId, setSelectedDeliveryId] = useState('ktm_valley');
        const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
        const [checkoutStep, setCheckoutStep] = useState('form'); // 'form' | 'payment' | 'success'
        const [checkoutQrUrl, setCheckoutQrUrl] = useState('');
        const [copiedField, setCopiedField] = useState('');
        const [paymentTxnId, setPaymentTxnId] = useState('');
        const [customerInfo, setCustomerInfo] = useState({
          fullName: '',
          mobile: '',
          province: 'Bagmati Province',
          city: 'Kathmandu',
          address: '',
          paymentMethod: 'cod'
        });
        const [confirmedOrderId, setConfirmedOrderId] = useState('');
        const [showDeliveryGuide, setShowDeliveryGuide] = useState(false);
        const [quickViewProduct, setQuickViewProduct] = useState(null);
        const [selectedSize, setSelectedSize] = useState('');

        // Derived Calculations
        const cartItemCount = useMemo(() => cart.reduce((t, i) => t + i.quantity, 0), [cart]);
        const cartSubtotal = useMemo(() => cart.reduce((t, i) => t + i.product.priceNPR * i.quantity, 0), [cart]);
        const activeDelivery = useMemo(() => NEPAL_DELIVERY_OPTIONS.find(o => o.id === selectedDeliveryId) || NEPAL_DELIVERY_OPTIONS[0], [selectedDeliveryId]);
        const deliveryFee = useMemo(() => {
          if (activeDelivery.freeAboveNPR && cartSubtotal >= activeDelivery.freeAboveNPR) return 0;
          return activeDelivery.rateNPR;
        }, [cartSubtotal, activeDelivery]);
        const orderTotal = cartSubtotal + (cart.length > 0 ? deliveryFee : 0);

        // Filtered catalog
        const filteredProducts = useMemo(() => {
          return products.filter(p => {
            const matchCat = activeCategory === 'All Merchandise' || p.category === activeCategory;
            const matchHero = activeHero === 'All Heroes' || p.hero.toLowerCase() === activeHero.toLowerCase();
            const matchSearch = !searchQuery.trim() ||
              p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
              p.hero.toLowerCase().includes(searchQuery.toLowerCase()) ||
              p.category.toLowerCase().includes(searchQuery.toLowerCase());
            return matchCat && matchHero && matchSearch;
          }).sort((a, b) => {
            if (sortBy === 'price-asc') return a.priceNPR - b.priceNPR;
            if (sortBy === 'price-desc') return b.priceNPR - a.priceNPR;
            if (a.featured && !b.featured) return -1;
            if (!a.featured && b.featured) return 1;
            return 0;
          });
        }, [products, activeCategory, activeHero, searchQuery, sortBy]);

        // Generate Live Payment QR at checkout
        useEffect(() => {
          if (isCheckoutOpen && checkoutStep === 'payment' && confirmedOrderId && window.QRCode) {
            const payload = generateNepalQrPayload(bankDetails, orderTotal, confirmedOrderId, customerInfo.paymentMethod);
            window.QRCode.toDataURL(payload, { width: 300, margin: 2 })
              .then(url => setCheckoutQrUrl(url))
              .catch(err => console.error(err));
          }
        }, [isCheckoutOpen, checkoutStep, confirmedOrderId, bankDetails, orderTotal, customerInfo.paymentMethod]);

        // Generate Live Preview QR in Admin settings
        useEffect(() => {
          if (showPaymentSettingsModal && window.QRCode) {
            const testPayload = generateNepalQrPayload(paymentForm, Number(adminTestAmount) || 1500, 'TEST-PREVIEW', 'fonepay');
            window.QRCode.toDataURL(testPayload, { width: 240, margin: 2 })
              .then(url => setAdminPreviewQr(url))
              .catch(err => console.error(err));
          }
        }, [showPaymentSettingsModal, paymentForm, adminTestAmount]);

        const handleAddToCart = (product, size) => {
          const s = size || (product.sizes ? product.sizes[0] : undefined);
          setCart(prev => {
            const idx = prev.findIndex(item => item.product.id === product.id && item.selectedSize === s);
            if (idx > -1) {
              const next = [...prev];
              next[idx] = { ...next[idx], quantity: next[idx].quantity + 1 };
              return next;
            }
            return [...prev, { product, selectedSize: s, quantity: 1 }];
          });
          setIsCartOpen(true);
        };

        const updateCartQty = (productId, size, delta) => {
          setCart(prev => prev.map(item => {
            if (item.product.id === productId && item.selectedSize === size) {
              const q = item.quantity + delta;
              return q > 0 ? { ...item, quantity: q } : null;
            }
            return item;
          }).filter(Boolean));
        };

        const handleCopy = (text, field) => {
          navigator.clipboard.writeText(text);
          setCopiedField(field);
          setTimeout(() => setCopiedField(''), 2000);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          const val = adminPasswordInput.trim();
          if (val === adminPassword || val === 'ningstore' || val === 'admin123') {
            setIsAdmin(true);
            localStorage.setItem('ningstore_admin_auth', 'true');
            setShowAdminLoginModal(false);
            setAdminPasswordInput('');
            setAdminLoginError('');
          } else {
            setAdminLoginError('Incorrect password. Please verify and try again.');
          }
        };

        const handleAdminLogout = () => {
          setIsAdmin(false);
          localStorage.removeItem('ningstore_admin_auth');
        };

        const handleChangePassword = (e) => {
          e.preventDefault();
          setPasswordError('');
          setPasswordSuccess('');
          if (passwordForm.current.trim() !== adminPassword && passwordForm.current.trim() !== 'ningstore') {
            setPasswordError('Current password does not match.');
            return;
          }
          if (passwordForm.next.trim().length < 4) {
            setPasswordError('New password must have at least 4 characters.');
            return;
          }
          if (passwordForm.next.trim() !== passwordForm.confirm.trim()) {
            setPasswordError('New passwords do not match.');
            return;
          }
          const nextPwd = passwordForm.next.trim();
          setAdminPassword(nextPwd);
          localStorage.setItem('ningstore_admin_password', nextPwd);
          setPasswordSuccess('Password successfully updated!');
          setTimeout(() => {
            setShowResetPasswordModal(false);
            setPasswordForm({ current: '', next: '', confirm: '' });
            setPasswordSuccess('');
          }, 1500);
        };

        const handleSaveProduct = (e) => {
          e.preventDefault();
          if (!productForm.title.trim()) return;
          const parsedSizes = productForm.category === 'Apparel' && productForm.sizes.trim()
            ? productForm.sizes.split(',').map(s => s.trim()).filter(Boolean)
            : undefined;

          const img = productForm.image.trim() || 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=800&auto=format&fit=crop&q=80';

          if (editingProduct) {
            setProducts(prev => prev.map(p => p.id === editingProduct.id ? {

              hero: productForm.hero,
              category: productForm.category,

              originalPriceNPR: Number(productForm.originalPriceNPR || productForm.priceNPR),
              image: img,
              description: productForm.description,
              specs: { material: productForm.material, scaleOrFit: productForm.scaleOrFit },
              sizes: parsedSizes,
              stock: Number(productForm.stock),
              featured: productForm.featured
            } : p));
          } else {
            const newItem = {
              id: 'p-' + Date.now(),
              title: productForm.title,
              hero: productForm.hero,
              category: productForm.category,
              priceNPR: Number(productForm.priceNPR),
              originalPriceNPR: Number(productForm.originalPriceNPR || productForm.priceNPR),

              description: productForm.description || `Official ${productForm.hero} merchandise verified by Ningstore Nepal.`,
              specs: { material: productForm.material || 'Standard', scaleOrFit: productForm.scaleOrFit || 'Standard' },
              sizes: parsedSizes,
              stock: Number(productForm.stock),
              featured: productForm.featured
            };
            setProducts(prev => [newItem, ...prev]);

          setShowProductModal(false);
          setEditingProduct(null);
        };

        const handlePlaceOrder = (e) => {
          e.preventDefault();
          if (!customerInfo.fullName.trim() || !customerInfo.mobile.trim() || !customerInfo.address.trim()) {

        const handleDownloadIndexHtml = () => {
          fetch('/index.html')
            .then(r => r.text())
            .then(html => {
              const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'index.html';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            })
            .catch(() => {
              const docHtml = '<!doctype html>\n' + document.documentElement.outerHTML;
              const blob = new Blob([docHtml], { type: 'text/html;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'index.html';

                              const s = 'https://hamrobazar.com/product/thor-hammer-mjolnir-metal-replica-with-stand/198234';
                              setImportUrl(s);
                              handleExtractFromUrl(s);
                            }}
                            className="text-amber-400 underline"
                          >
                            Hamrobazar Thor Mjolnir
                          </button>
                        </div>

                        {extractSuccessMsg && (
                          <div className="p-2 rounded bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 text-xs">
                            ✓ {extractSuccessMsg}
                          </div>
                        )}
                        {extractErrorMsg && (
                          <div className="p-2 rounded bg-red-950/40 border border-red-500/40 text-red-300 text-xs">
                            ✕ {extractErrorMsg}
                          </div>
                        )}
                      </div>
                    )}

                    <div>
                      <label className="block text-zinc-300 mb-1">Product Title *</label>
                      <input
                        type="text"
                        required
                        value={productForm.title}
                        onChange={(e) => setProductForm({ ...productForm, title: e.target.value })}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-zinc-300 mb-1">Hero *</label>
                        <select
                          value={productForm.hero}
                          onChange={(e) => setProductForm({ ...productForm, hero: e.target.value })}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        >
                          <option>Iron Man</option>
                          <option>Spider-Man</option>
                          <option>Thor</option>
                          <option>Captain America</option>
                          <option>Deadpool</option>
                          <option>Thanos</option>
                          <option>Black Panther</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-zinc-300 mb-1">Category *</label>
                        <select
                          value={productForm.category}
                          onChange={(e) => setProductForm({ ...productForm, category: e.target.value })}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        >
                          <option>Apparel</option>
                          <option>Action Figures</option>
                          <option>Collectibles & Props</option>
                        </select>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-zinc-300 mb-1">Selling Price (Rs.) *</label>
                        <input
                          type="number"
                          required
                          value={productForm.priceNPR}
                          onChange={(e) => setProductForm({ ...productForm, priceNPR: e.target.value })}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-zinc-300 mb-1">Original Price (Rs.)</label>
                        <input
                          type="number"
                          value={productForm.originalPriceNPR}
                          onChange={(e) => setProductForm({ ...productForm, originalPriceNPR: e.target.value })}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-zinc-300 mb-1">Image URL *</label>
                      <div className="flex gap-2">
                        <input
                          type="url"
                          placeholder="https://..."
                          value={productForm.image}
                          onChange={(e) => setProductForm({ ...productForm, image: e.target.value })}
                          className="flex-1 bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        />
                        {productForm.image && (
                          <img src={productForm.image} alt="Preview" className="w-10 h-10 object-cover rounded border border-zinc-700 bg-zinc-800" />
                        )}
                      </div>

                      {extractedGalleryImages.length > 0 && (
                        <div className="mt-2 p-2 bg-zinc-950 border border-zinc-800 rounded space-y-1">
                          <span className="text-[11px] text-amber-300 font-semibold block">Select Primary Image:</span>
                          <div className="flex gap-2 overflow-x-auto pb-1">
                            {extractedGalleryImages.map((imgUrl, i) => (
                              <button
                                key={i}
                                type="button"
                                onClick={() => setProductForm({ ...productForm, image: imgUrl })}
                                className={`border-2 rounded overflow-hidden shrink-0 ${productForm.image === imgUrl ? 'border-red-500' : 'border-zinc-800 opacity-60'}`}
                              >
                                <img src={imgUrl} className="w-12 h-12 object-cover" />
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-zinc-300 mb-1">Stock</label>
                        <input
                          type="number"
                          value={productForm.stock}
                          onChange={(e) => setProductForm({ ...productForm, stock: e.target.value })}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                        />
                      </div>
                      {productForm.category === 'Apparel' && (
                        <div>
                          <label className="block text-zinc-300 mb-1">Sizes (comma separated)</label>
                          <input
                            type="text"
                            value={productForm.sizes}
                            onChange={(e) => setProductForm({ ...productForm, sizes: e.target.value })}
                            className="w-full bg-zinc-950 border border-zinc-800 rounded p-2 text-white"
                          />
                        </div>
                      )}
                    </div>
                    <button type="submit" className="w-full py-2 bg-red-600 text-white font-bold rounded">
                      Publish Product
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* Delivery Guide Modal */}
            {showDeliveryGuide && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                <div className="bg-zinc-900 border border-zinc-800 rounded-xl max-w-md w-full p-6 relative space-y-3">
                  <button onClick={() => setShowDeliveryGuide(false)} className="absolute top-4 right-4 text-zinc-400">✕</button>
                  <h3 className="text-lg font-bold text-white">Nepal Nationwide Delivery</h3>
                  <div className="space-y-2 text-xs">
                    <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                      <strong>Kathmandu Valley:</strong> 24–48 hours · Rs. 100 (Free over Rs. 2,500)
                    </div>
                    <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                      <strong>Major Hubs (Pokhara, Chitwan, etc.):</strong> 2–3 Days · Rs. 180 (Free over Rs. 4,000)
                    </div>
                    <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                      <strong>All 77 Districts:</strong> 3–5 Days via Nepal Post / Express Courier · Rs. 250
                    </div>
                  </div>
                  <button onClick={() => setShowDeliveryGuide(false)} className="w-full py-2 bg-red-600 text-white font-bold text-xs rounded">
                    Close
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<NingstoreApp />);
    </script>
  </body>
</html>
